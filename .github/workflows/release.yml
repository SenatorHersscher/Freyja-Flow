name: Build and Release Freyja Flow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Executables
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/freyja-flow-windows-x64.exe
            bin/freyja-flow-linux-x64
          name: Freyja Flow Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # 🔮 Freyja Flow ${{ github.ref_name }}

            ### 🚀 İndirme Seçenekleri:
            - **🪟 Windows Kullanıcıları:** Aşağıdan `freyja-flow-windows-x64.exe` dosyasını indirip çift tıklayarak çalıştırın.
            - **🐧 Linux Kullanıcıları:** `freyja-flow-linux-x64` dosyasını indirin, `chmod +x` izni verip çalıştırın.
